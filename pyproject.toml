[project]
name = "capstone"
version = "0.1.0"
description = "Segment-level wildlife-vehicle collision risk on state highways, Oregon and Idaho (UC Berkeley MIDS W210)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "geopandas>=1.1.4",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "rasterio>=1.5.2",
    "rasterstats>=0.21.0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
